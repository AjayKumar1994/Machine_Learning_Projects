[project]
name = "production-rag-system"
version = "0.1.0"
description = "Production-ready RAG template with FastAPI runtime and offline indexing pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["app"]
